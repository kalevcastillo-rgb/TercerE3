<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #4586a1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-login {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            animation: aparecer 0.6s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .contenedor-login h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .contenedor-login p.subtitulo {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .campo input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .campo input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
        }

        .boton {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .boton:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.5);
        }

        .boton:active {
            transform: translateY(0);
        }

        .mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        .mensaje.error { color: #e74c3c; }
        .mensaje.exito { color: #27ae60; }

        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="contenedor-login">
        <h2> Iniciar Sesión</h2>
        <p class="subtitulo">Ingresa tus Datos </p>

        <form id="formLogin" onsubmit="return validarLogin(event)">
            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Escribe tu usuario" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Escribe tu contraseña" required>
            </div>

            <button type="submit" class="boton">Ingresar</button>

            <div id="mensaje" class="mensaje"></div>
        </form>

        <p class="info">Usuario: <b>admin</b> | Contraseña: <b>1234</b></p>
    </div>

    <script>
        const usuarios = [
            { usuario: "admin",   password: "1234" },
            { usuario: "alumno",  password: "escuela2024" },
            { usuario: "profesor", password: "clase123" }
        ];

        function validarLogin(evento) {
            evento.preventDefault(); 

            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();
            const mensaje = document.getElementById("mensaje");

            if (usuario === "" || password === "") {
                mensaje.textContent = "Todos los campos son obligatorios";
                mensaje.className = "mensaje error";
                return false;
            }
            const encontrado = usuarios.find(
                u => u.usuario === usuario && u.password === password
            );

            if (encontrado) {
                mensaje.textContent = " ¡Bienvenido, " + usuario + "!";
                mensaje.className = "mensaje exito";
                setTimeout(() => {
                    alert("Acceso concedido a " + usuario);
                }, 500);
            } else {
                mensaje.textContent = "Usuario o contraseña incorrectos";
                mensaje.className = "mensaje error";
            }
            return false;
        }
    </script>
</body>
</html>
